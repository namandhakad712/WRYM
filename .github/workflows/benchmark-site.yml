# WRYM · Benchmark archive → GitHub Pages
#
# Three jobs:
#  1. verify (push + PR) — re-certify the whole level ladder AND every
#     community level with the deterministic validator (cheap, no API
#     calls). A broken level fails CI.
#  2. deploy (main only) — the site is a pure function of results/ +
#     site/ + community-levels/: re-certify community certificates,
#     re-export the archive from committed results (guarding against a
#     stale data/ in the repo) and publish to GitHub Pages.
#
# The fully automated loop:
#   PR adds community-levels/foo.json → verify certifies it → merge →
#   deploy re-exports → the level is live on the public ladder.
#
# No secrets required: benchmark runs happen LOCALLY on contributors'
# machines; their JSON artifacts are committed and this workflow only
# re-renders + ships them.

name: benchmark-site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Certify official level ladder (BFS validator)
        run: bun scripts/validate-tier3.ts
      - name: Certify community levels
        run: bun scripts/validate-community.ts

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Refresh community certificates (authoritative difficulty)
        run: bun scripts/validate-community.ts
      - name: Re-export archive from committed results (idempotent)
        run: bun scripts/export-site.ts
      - name: Rebuild browser engine bundle (single source of truth)
        run: bun build scripts/engine-browser-entry.ts --outfile site/assets/wyrm-engine.js --format iife --minify
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
